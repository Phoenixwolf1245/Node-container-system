# Independent NCS logger. The Rust compiler's own diagnostics are separate.
log_level=4
log_file=logs/ncs.log
log_timestamp=yyyy|mm|dd|hh:tt:ss:ms
log_max_bytes=10485760
log_history_days=7
log_max_history_files=20
# Only capture user-provided input values if explicitly enabled.
log_input_values=false
